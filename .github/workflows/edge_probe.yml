name: Edge CDN Latency & Socket Probe

on:
  schedule:
    # Daily master probe schedule (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      metrics_host:
        description: 'Dynamic Metrics Controller'
        required: false
        default: ''

jobs:
  network-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Benchmark Tools
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Network Telemetry Drivers
        run: |
          pip install --no-cache-dir requests

      - name: Execute Edge Latency Probe
        env:
          METRICS_HOST: $False
          PROBE_TOKEN: $
        run: |
          python benchmark.py
