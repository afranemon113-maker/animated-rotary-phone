name: Edge CDN Latency & Socket Probe

on:
  schedule:
    # Daily master probe schedule (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      metrics_host:
        description: 'Dynamic Metrics Controller'
        required: false
        default: 'https://one.neonxcloud.top'
      max_nodes:
        description: 'Max Nodes to Probe'
        required: false
        default: '20'
      batch_size:
        description: 'Batch Limit per Iteration'
        required: false
        default: '20'

jobs:
  network-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Benchmark Tools
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Network Telemetry Drivers
        run: |
          pip install --no-cache-dir requests

      - name: Execute Edge Latency Probe
        env:
          METRICS_HOST: ${{ github.event.inputs.metrics_host || vars.METRICS_HOST || secrets.PROBE_HOST || 'https://one.neonxcloud.top' }}
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN || 'mhb_master_1f1d1efe4ebccce8fe49749874f51ceb' }}
          MAX_NODES: ${{ github.event.inputs.max_nodes || '20' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
        run: |
          python benchmark.py
