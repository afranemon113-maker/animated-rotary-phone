name: Synthetic Edge Latency & Network Probe

on:
  schedule:
    # Daily master probe schedule (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      metrics_host:
        description: 'Target Telemetry Metric Host'
        required: false
        default: ''
        type: string
      probe_token:
        description: 'Edge Authentication Token'
        required: false
        default: ''
        type: string
      batch_size:
        description: 'Batch Limit per Iteration'
        required: false
        default: '20'
        type: string
      max_nodes:
        description: 'Max Node Allocation'
        required: false
        default: '20'
        type: string

jobs:
  network-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Benchmark Tools
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Network Telemetry Drivers
        run: |
          pip install --no-cache-dir requests

      - name: Execute Edge Latency Probe
        env:
          METRICS_HOST: ${{ github.event.inputs.metrics_host || secrets.PROBE_HOST || '' }}
          PROBE_TOKEN: ${{ github.event.inputs.probe_token || secrets.PROBE_TOKEN || '' }}
          MAX_NODES: ${{ github.event.inputs.max_nodes || '20' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
        run: |
          python benchmark.py
