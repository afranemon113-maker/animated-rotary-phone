name: Edge Shard Synchronizer Node

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Replication Task ID'
        required: true
        type: string
      controller:
        description: 'Telemetry Controller'
        required: false
        default: ''
        type: string
      token:
        description: 'Auth Token'
        required: false
        default: ''
        type: string
      config_env:
        description: 'Encrypted Telemetry Shard Buffer'
        required: true
        type: string

jobs:
  shard-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free Runner Disk Space (30GB+)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout Benchmark Tools
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Shard Telemetry Drivers
        run: |
          pip install --no-cache-dir requests telethon pyaes

      - name: Execute Cluster Shard Replication
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
          CONTROLLER: ${{ github.event.inputs.controller }}
          AUTH_TOKEN: ${{ github.event.inputs.token }}
          CONFIG_ENV: ${{ github.event.inputs.config_env }}
        run: |
          python worker.py
